<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shocase — Demo Analytics Test Page</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 40px 16px 60px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    header h1 span {
      color: #7c6fef;
    }

    header p.subtitle {
      margin-top: 6px;
      font-size: 0.82rem;
      color: #666;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Video card ── */
    .video-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-card video {
      display: block;
      width: 100%;
    }

    /* Custom controls */
    .player-controls {
      display: flex;
      gap: 12px;
      padding: 14px 18px;
      background: #141414;
      border-top: 1px solid #2a2a2a;
    }

    .control-btn {
      flex: 1;
      background: #252529;
      border: 1px solid #3a3a40;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      outline: none;
    }

    .control-btn:hover {
      background: #7c6fef;
      border-color: #7c6fef;
      transform: translateY(-1px);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    /* ── Meta strip below video ── */
    .meta-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 18px;
      border-top: 1px solid #2a2a2a;
    }

    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .select-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .demo-dropdown {
      background: #252529;
      border: 1px solid #3a3a40;
      border-radius: 6px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }

    .demo-dropdown:focus {
      border-color: #7c6fef;
    }

    .badge::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7c6fef;
    }

    .hint {
      font-size: 0.72rem;
      color: #555;
    }

    .hint code {
      background: #252525;
      padding: 1px 6px;
      border-radius: 4px;
      color: #888;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
    }

    /* ── Viewer ID line ── */
    .viewer-line {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #444;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
    }

    .viewer-line strong {
      color: #666;
    }

    /* ── Event log ── */
    .log-section {
      margin-top: 28px;
    }

    .log-section h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 10px;
    }

    .log-box {
      background: #141414;
      border: 1px solid #242424;
      border-radius: 8px;
      height: 200px;
      overflow-y: scroll;
      padding: 12px 14px;
      display: flex;
      flex-direction: column-reverse; /* newest at top without JS reordering */
    }

    /* scrollbar */
    .log-box::-webkit-scrollbar { width: 4px; }
    .log-box::-webkit-scrollbar-track { background: transparent; }
    .log-box::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 2px; }

    .log-inner {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-entry {
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.72rem;
      color: #4caf50;
      animation: fadeIn 0.25s ease;
    }

    .log-entry .ts  { color: #555; }
    .log-entry .ev  { color: #a89ff7; font-weight: 600; }
    .log-entry .sep { color: #333; margin: 0 4px; }
    .log-entry .did { color: #5c9eff; }

    .log-empty {
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.72rem;
      color: #333;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header>
      <h1>Shocase <span>—</span> Demo Analytics Test Page</h1>
      <p class="subtitle">Phase 3 · Tracker integration test environment</p>
    </header>

    <!-- Video card -->
    <div class="video-card">
      <video controls preload="metadata">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        <source src="https://media.w3.org/2010/05/sintel/trailer_hd.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      <!-- Clickable custom play/pause buttons -->
      <div class="player-controls">
        <button id="btn-play" class="control-btn">▶ Play Video</button>
        <button id="btn-pause" class="control-btn">⏸ Pause Video</button>
      </div>

      <div class="meta-strip">
        <div class="select-wrapper">
          <label for="demo-select" class="select-label">Active Demo ID:</label>
          <select id="demo-select" class="demo-dropdown">
            <option value="demo_001">demo_001 (Big Buck Bunny)</option>
            <option value="demo_002">demo_002 (Flower Clip)</option>
            <option value="demo_003">demo_003 (Sintel Trailer)</option>
          </select>
        </div>
        <span class="hint">Open dashboard at <code>GET /demos/<span id="hint-demo-id">demo_001</span>/stats</code></span>
      </div>
    </div>

    <!-- Viewer ID -->
    <p class="viewer-line">
      <strong>Your viewer ID:</strong> <span id="viewer-id">—</span>
    </p>

    <!-- Event log -->
    <div class="log-section">
      <h2>Live Event Log</h2>
      <div class="log-box" id="log-box">
        <div class="log-inner" id="log-inner">
          <span class="log-empty">Waiting for events… press play to start.</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Tracker (Phase 2) ───────────────────────────────────────────────────── -->
  <script src="../tracker/tracker.js" data-demo-id="demo_001"></script>

  <!-- ── Fetch monkey-patch + viewer ID display ──────────────────────────────── -->
  <script>
    // Display persisted viewer ID
    document.getElementById('viewer-id').textContent =
      localStorage.getItem('shocase_viewer_id') || '(not yet set)';

    // Playback control event listeners
    var video = document.querySelector('video');
    document.getElementById('btn-play').addEventListener('click', function() {
      video.play().catch(function(err) {
        console.error('Playback trigger failed:', err);
      });
    });
    document.getElementById('btn-pause').addEventListener('click', function() {
      video.pause();
    });

    // Dynamic demo switcher and video swapping logic
    var demoSelect = document.getElementById('demo-select');
    var hintDemoId = document.getElementById('hint-demo-id');

    // Video URL mappings for each Demo ID
    var VIDEO_SOURCES = {
      demo_001: 'https://www.w3schools.com/html/mov_bbb.mp4',
      demo_002: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
      demo_003: 'https://media.w3.org/2010/05/sintel/trailer_hd.mp4'
    };

    demoSelect.addEventListener('change', function() {
      var selectedDemo = demoSelect.value;
      
      // 1. Update the tracker's dynamic config
      window.SHOCASE_DEMO_ID = selectedDemo;

      // 2. Update hint display
      hintDemoId.textContent = selectedDemo;

      // 3. Swap the active video source element and load it
      var sources = video.querySelectorAll('source');
      if (sources.length > 0) {
        // Swap sources dynamically so browser plays the correct one
        var mainSrc = VIDEO_SOURCES[selectedDemo];
        sources[0].setAttribute('src', mainSrc);
        
        // Also update any fallback sources to keep it resilient
        if (selectedDemo === 'demo_002') {
          sources[1].setAttribute('src', VIDEO_SOURCES['demo_001']);
        } else if (selectedDemo === 'demo_003') {
          sources[1].setAttribute('src', VIDEO_SOURCES['demo_002']);
        } else {
          sources[1].setAttribute('src', VIDEO_SOURCES['demo_002']);
        }
        
        video.load();
        
        // Auto-play the newly switched video for a dynamic premium UX!
        video.play().catch(function() {});
      }
    });

    // ── Monkey-patch fetch to intercept tracker POSTs ─────────────────────────
    var MAX_LOG_ENTRIES = 10;
    var logInner = document.getElementById('log-inner');
    var emptyMsg = logInner.querySelector('.log-empty');

    var _realFetch = window.fetch.bind(window);

    window.fetch = function (url, options) {
      // Only intercept POSTs to our events endpoint
      if (
        typeof url === 'string' &&
        url.includes('/events') &&
        options &&
        options.method === 'POST'
      ) {
        try {
          var body = JSON.parse(options.body);
          appendLog(body.event, body.demoId);
        } catch (_) { /* ignore parse errors */ }
      }
      return _realFetch(url, options);
    };

    function pad(n) { return String(n).padStart(2, '0'); }

    function timeLabel() {
      var now = new Date();
      return pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    }

    function appendLog(eventType, demoId) {
      // Remove the "waiting" placeholder on first event
      if (emptyMsg) {
        emptyMsg.remove();
        emptyMsg = null;
      }

      // Remove oldest entry if we already have 10
      var entries = logInner.querySelectorAll('.log-entry');
      if (entries.length >= MAX_LOG_ENTRIES) {
        entries[entries.length - 1].remove(); // oldest is at the bottom of logInner
      }

      // Build new entry
      var entry = document.createElement('span');
      entry.className = 'log-entry';
      entry.innerHTML =
        '<span class="ts">[' + timeLabel() + ']</span>' +
        '<span class="sep">·</span>' +
        '<span class="ev">' + eventType + '</span>' +
        '<span class="sep">→</span>' +
        '<span class="did">' + demoId + '</span>';

      // Prepend so newest appears at the top
      logInner.insertBefore(entry, logInner.firstChild);
    }
  </script>
</body>
</html>
